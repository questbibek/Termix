name: Sync Upstream

# Manual one-click sync that keeps `main` a pristine mirror of Termix-SSH/Termix.
# Two-branch model: this ONLY updates main. It does NOT touch `vrit` (the deploy
# branch) — you merge main -> vrit locally so you can resolve VRIT-fenced
# conflicts, then push vrit to deploy. See UPSTREAM_SYNC.md.
# --ff-only must always succeed here; if it fails, something committed Vrit
# changes to main (main must stay clean).

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream (fast-forward only)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Termix-SSH/Termix
          git fetch upstream
          git checkout main
          git merge --ff-only upstream/main
          git push origin main
